name: Backend CI/CD

on:
  push:
    branches:
      - feature/full-stack
    paths:
      - 'Server/**'
  pull_request:
    branches:
      - feature/full-stack
    paths:
      - 'Server/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: starttech-backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: Server/MuchToDo/go.sum

      - name: Install dependencies
        working-directory: Server/MuchToDo
        run: go mod download

      - name: Run unit tests
        working-directory: Server/MuchToDo
        run: go test ./... -v
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DB_NAME: much_todo_db
          JWT_SECRET_KEY: test-secret-key
          PORT: "8080"

      - name: Code quality check
        working-directory: Server/MuchToDo
        run: |
          go vet ./...
          echo "Code quality check passed"

      - name: Run vulnerability scan
        working-directory: Server/MuchToDo
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} Server/MuchToDo/
          docker tag ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL

      - name: Push to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/feature/full-stack' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure auto-scaling policies
        run: |
          aws autoscaling put-scaling-policy \
            --auto-scaling-group-name starttech-asg \
            --policy-name starttech-scale-up \
            --policy-type SimpleScaling \
            --adjustment-type ChangeInCapacity \
            --scaling-adjustment 1 \
            --cooldown 300 || echo "Scale up policy already exists"
          aws autoscaling put-scaling-policy \
            --auto-scaling-group-name starttech-asg \
            --policy-name starttech-scale-down \
            --policy-type SimpleScaling \
            --adjustment-type ChangeInCapacity \
            --scaling-adjustment -1 \
            --cooldown 300 || echo "Scale down policy already exists"

      - name: Setup CloudWatch monitoring
        run: |
          aws logs create-log-group \
            --log-group-name /starttech/starttech/backend \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Log group already exists"
          aws logs put-retention-policy \
            --log-group-name /starttech/starttech/backend \
            --retention-in-days 30

      - name: Deploy to ASG via rolling update
        run: |
          ASG_NAME="starttech-asg"
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name $ASG_NAME \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 60}'

      - name: Wait for deployment
        run: |
          ASG_NAME="starttech-asg"
          echo "Waiting for instance refresh to complete..."
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name $ASG_NAME \
              --query 'InstanceRefreshes[0].Status' \
              --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then
              echo "Deployment successful!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment failed!"
              exit 1
            fi
            sleep 30
          done

      - name: Smoke test
        run: |
          sleep 60
          MAX_RETRIES=10
          RETRY_COUNT=0
          RETRY_DELAY=5
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f http://${{ secrets.ALB_DNS_NAME }}/health; then
              echo "Smoke test passed!"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES failed, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY + 5))
          done
          echo "Smoke test failed after $MAX_RETRIES attempts"
          exit 1
